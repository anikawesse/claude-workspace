<!-- ============================================================
     KALENDER-BUTTON Gelände-Workshop (eigener AddEvent-Nachbau)
     In Devine als "Eigenes HTML / Code"-Element einfügen.
     Für den nächsten Termin nur den Block EINSTELLUNGEN ändern.
     ============================================================ -->
<div class="apa-kal" id="apa-kal">
  <div class="apa-kal-wrap">
  <button type="button" class="apa-kal-btn" id="apa-kal-btn" aria-haspopup="true" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18M12 13.5v5M9.5 16h5"/></svg>
    <span>Zum Kalender hinzufügen</span>
    <svg class="apa-kal-pfeil" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="apa-kal-menu" id="apa-kal-menu" role="menu">
    <a role="menuitem" id="apa-kal-apple" href="#">
      <span class="apa-kal-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.7 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.3.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.8-1.1-2.8-4.2zM13.9 5.2c.7-.8 1.2-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/></svg></span>
      Apple / iPhone Kalender
    </a>
    <a role="menuitem" id="apa-kal-google" href="#" target="_blank" rel="noopener">
      <span class="apa-kal-ico"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9c-.3 1.4-1 2.5-2.2 3.3v2.7h3.6c2-1.9 3.2-4.7 3.2-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8C3.9 20.6 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.8 14.2c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2V7H2.1C1.4 8.5 1 10.2 1 12s.4 3.5 1.1 5l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.5 2.1 15 1 12 1 7.7 1 3.9 3.4 2.1 7l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg></span>
      Google Kalender
    </a>
    <a role="menuitem" id="apa-kal-outlook" href="#" target="_blank" rel="noopener">
      <span class="apa-kal-ico"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="13" height="16" rx="2" fill="#0A64C8"/><ellipse cx="8.5" cy="12" rx="3.2" ry="3.6" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M15 7h6.5c.3 0 .5.2.5.5v9c0 .3-.2.5-.5.5H15z" fill="#28A8EA"/><path d="M15 9l3.5 2.5L22 9" fill="none" stroke="#fff" stroke-width="1.3"/></svg></span>
      Outlook.com / Hotmail
    </a>
    <a role="menuitem" id="apa-kal-office" href="#" target="_blank" rel="noopener">
      <span class="apa-kal-ico"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5L14 3l6 2v14l-6 2-10-3.5 10 1.5V6z" fill="#D83B01"/></svg></span>
      Office 365 / Outlook (Arbeit)
    </a>
    <a role="menuitem" id="apa-kal-ics" href="#">
      <span class="apa-kal-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></span>
      Anderer Kalender (.ics-Datei)
    </a>
  </div>
  </div>
  <p class="apa-kal-hinweis">So. 22. November 2026 &middot; 19 Uhr &middot; live in Zoom</p>
</div>

<style>
.apa-kal{position:relative;display:block;max-width:420px;margin:24px auto;text-align:center;font-family:'Montserrat',Arial,sans-serif}
.apa-kal *{box-sizing:border-box}
.apa-kal-wrap{position:relative}
.apa-kal-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#691212;color:#fff;font-family:inherit;font-weight:800;font-size:17px;letter-spacing:.3px;padding:18px 28px;border:none;border-radius:50px;cursor:pointer;transition:background .2s}
.apa-kal-btn:hover,.apa-kal-btn:focus-visible{background:#550f0f;outline:none}
.apa-kal-pfeil{transition:transform .2s}
.apa-kal.offen .apa-kal-pfeil{transform:rotate(180deg)}
.apa-kal-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:999;background:#fff;border:2px solid #e8d8c4;border-radius:14px;box-shadow:0 12px 32px rgba(74,56,40,.18);padding:8px;text-align:left}
.apa-kal.offen .apa-kal-menu{display:block}
.apa-kal-menu a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:9px;color:#1a1a1a;font-size:15px;font-weight:600;text-decoration:none;line-height:1.3}
.apa-kal-menu a:hover,.apa-kal-menu a:focus-visible{background:#f5ede2;outline:none}
.apa-kal-menu a+a{margin-top:2px}
.apa-kal-ico{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex-shrink:0;border-radius:50%;background:#f5ede2;color:#1a1a1a}
.apa-kal-hinweis{margin:12px 0 0;font-size:13px;font-weight:600;color:#7a6050}
@media (max-width:480px){.apa-kal-btn{font-size:16px;padding:17px 20px}}
</style>

<script>
(function () {
  /* ================= EINSTELLUNGEN ================= */
  var TERMIN = {
    titel: 'Gelände-Workshop mit Anika (live in Zoom)',
    datum: '2026-11-22',      // JJJJ-MM-TT
    start: '19:00',           // deutsche Uhrzeit
    ende:  '21:00',           // deutsche Uhrzeit
    link:  'https://us06web.zoom.us/j/88243983552?pwd=CL5EcPERub3kjXO22tlcp8MOBeSIh6.1',
    ort:   'Online in Zoom',
    text:  'Wir treffen uns live in Zoom. Klicke zum Start einfach auf diesen Link:\n{LINK}\n\nPlane dir 2 Stunden ein und nimm dir gern etwas zu schreiben mit.\n\nIch freue mich auf dich!\nAnika',
    erinnerungen: [1440, 60], // Minuten vorher: 1 Tag und 1 Stunde
    dateiname: 'gelaende-workshop.ics',
    uid: 'gelaende-workshop-2026-11-22@anikas-pferdeakademie.de'
  };
  /* ================================================= */

  var root = document.getElementById('apa-kal');
  if (!root) return;

  // Deutsche Uhrzeit (Europe/Berlin, inkl. Sommer-/Winterzeit) in UTC umrechnen
  function berlinNachUTC(datum, zeit) {
    var d = datum.split('-').map(Number), z = zeit.split(':').map(Number);
    var wunsch = Date.UTC(d[0], d[1] - 1, d[2], z[0], z[1]);
    var t = wunsch;
    for (var i = 0; i < 2; i++) {
      var p = {};
      new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Berlin', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
        .formatToParts(new Date(t)).forEach(function (x) { p[x.type] = x.value; });
      var gesehen = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
      t += wunsch - gesehen;
    }
    return new Date(t);
  }
  function kompakt(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); } // 20261122T180000Z
  function isoZ(d) { return d.toISOString().replace(/\.\d{3}/, ''); }                       // 2026-11-22T18:00:00Z

  var start = berlinNachUTC(TERMIN.datum, TERMIN.start);
  var ende = berlinNachUTC(TERMIN.datum, TERMIN.ende);
  var beschreibung = TERMIN.text.replace('{LINK}', TERMIN.link);
  var enc = encodeURIComponent;

  var google = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + enc(TERMIN.titel)
    + '&dates=' + kompakt(start) + '/' + kompakt(ende)
    + '&ctz=Europe/Berlin'
    + '&details=' + enc(beschreibung)
    + '&location=' + enc(TERMIN.link);

  function outlookLink(host) {
    return 'https://' + host + '/calendar/0/action/compose?rru=addevent'
      + '&path=%2Fcalendar%2Faction%2Fcompose'
      + '&subject=' + enc(TERMIN.titel)
      + '&startdt=' + enc(isoZ(start))
      + '&enddt=' + enc(isoZ(ende))
      + '&body=' + enc(beschreibung.replace(/\n/g, '<br>'))
      + '&location=' + enc(TERMIN.link);
  }

  function icsText(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  function falten(zeile) { // ICS-Zeilen max. 75 Zeichen
    var out = [], erste = true;
    while (zeile.length > (erste ? 75 : 74)) { var n = erste ? 75 : 74; out.push((erste ? '' : ' ') + zeile.slice(0, n)); zeile = zeile.slice(n); erste = false; }
    out.push((erste ? '' : ' ') + zeile);
    return out.join('\r\n');
  }
  function baueIcs() {
    var z = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Anikas Pferdeakademie//Kalender-Button//DE',
      'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:' + TERMIN.uid,
      'DTSTAMP:' + kompakt(new Date()),
      'DTSTART:' + kompakt(start),
      'DTEND:' + kompakt(ende),
      'SUMMARY:' + icsText(TERMIN.titel),
      'DESCRIPTION:' + icsText(beschreibung),
      'LOCATION:' + icsText(TERMIN.link),
      'URL:' + TERMIN.link,
      'STATUS:CONFIRMED', 'TRANSP:OPAQUE'
    ];
    TERMIN.erinnerungen.forEach(function (min) {
      z.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsText(TERMIN.titel), 'TRIGGER:-PT' + min + 'M', 'END:VALARM');
    });
    z.push('END:VEVENT', 'END:VCALENDAR');
    return z.map(falten).join('\r\n') + '\r\n';
  }

  var istIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function ladeIcs() {
    var ics = baueIcs();
    if (istIOS) { // iPhone/iPad: öffnet direkt "Zum Kalender hinzufügen"
      window.location.href = 'data:text/calendar;charset=utf-8,' + enc(ics);
      return;
    }
    var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = TERMIN.dateiname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  var btn = document.getElementById('apa-kal-btn');
  function zu() { root.classList.remove('offen'); btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var offen = root.classList.toggle('offen');
    btn.setAttribute('aria-expanded', offen ? 'true' : 'false');
  });
  document.addEventListener('click', function (e) { if (!root.contains(e.target)) zu(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') zu(); });

  document.getElementById('apa-kal-google').href = google;
  document.getElementById('apa-kal-outlook').href = outlookLink('outlook.live.com');
  document.getElementById('apa-kal-office').href = outlookLink('outlook.office.com');
  ['apa-kal-google', 'apa-kal-outlook', 'apa-kal-office'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', zu);
  });
  ['apa-kal-apple', 'apa-kal-ics'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (e) { e.preventDefault(); zu(); ladeIcs(); });
  });

  // Aus der Mail: Seite mit #kalender aufrufen -> Button wird angesprungen und das Menü klappt auf
  if (/^#kalender/i.test(window.location.hash)) {
    setTimeout(function () {
      root.scrollIntoView({ behavior: 'smooth', block: 'start' });
      root.classList.add('offen');
      btn.setAttribute('aria-expanded', 'true');
    }, 400);
  }
})();
</script>
