<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vorschau Ergebnisseiten | Gelände-Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rost:#7B3F28; --caramel:#A9603B; --beige:#E6C5B4; --beige-hell:#F3E7DE;
    --creme:#FAF4EF; --text:#3A2C24; --text-hell:#6E5B4F; --weiss:#FFFFFF; --gruen:#8FA98A;
    --schatten:0 10px 30px rgba(123,63,40,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',system-ui,sans-serif;background:var(--creme);color:var(--text);line-height:1.6;padding:26px 16px 60px}
  .seite-titel{max-width:640px;margin:0 auto 22px;text-align:center}
  .seite-titel h1{font-family:'Playfair Display',serif;color:var(--rost);font-size:24px;margin-bottom:6px}
  .seite-titel p{color:var(--text-hell);font-size:14px}
  .grid{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .demo-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--caramel);margin:0 0 8px 4px}
  .card{background:var(--weiss);border-radius:20px;box-shadow:var(--schatten);padding:28px 26px 24px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--rost),var(--caramel),var(--beige))}
  .kicker{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--caramel);margin-bottom:8px}
  h2.head{font-family:'Playfair Display',serif;font-size:22px;color:var(--rost);margin-bottom:12px;line-height:1.25}
  p.lead{color:var(--text);font-size:15.5px;margin-bottom:18px}
  b{color:var(--rost);font-weight:600}
  .bereich{margin-bottom:16px}
  .bereich-kopf{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .bereich-title{font-weight:600;color:var(--text);font-size:15px}
  .bereich-sub{font-size:12.5px;color:var(--text-hell);margin:1px 0 7px}
  .bereich-level{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:99px;white-space:nowrap}
  .bar{height:12px;background:var(--beige-hell);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px}
  .bar-fill.lv-gut{background:var(--gruen)} .bereich-level.lv-gut{background:rgba(143,169,138,.20);color:#5f7a5a}
  .bar-fill.lv-mittel{background:var(--caramel)} .bereich-level.lv-mittel{background:var(--beige-hell);color:var(--caramel)}
  .bar-fill.lv-hoch{background:var(--rost)} .bereich-level.lv-hoch{background:rgba(123,63,40,.12);color:var(--rost)}
  .ergebnis-box{background:var(--beige-hell);border-radius:16px;padding:20px 20px 16px;margin:20px 0}
  .ergebnis-box h3{font-family:'Playfair Display',serif;font-size:19px;color:var(--rost);margin-bottom:8px}
  .ergebnis-box p{color:var(--text-hell);font-size:15px}
  .mailhint{background:var(--beige-hell);border-radius:12px;padding:14px 16px;font-size:14.5px;color:var(--text);text-align:center;margin-top:18px}
</style>
</head>
<body>
  <div class="seite-titel">
    <h1>Vorschau: alle Ergebnis-Varianten</h1>
    <p>So sieht die Ergebnisseite je nach Antworten aus. Nur zum Anschauen, das ist nicht die Live-Seite.</p>
  </div>
  <div class="grid" id="grid"></div>

<script>
const MEILEN=[
  {nr:1,title:"Fundament am Boden",sub:"Vertrauen und Kommunikation"},
  {nr:2,title:"Souveräne Führungsperson",sub:"Kopfkino im Griff"},
  {nr:3,title:"Entspannt vom Hof",sub:"auch ohne Pferdekumpel"},
  {nr:4,title:"Souverän draußen unterwegs",sub:"Notfallstrategien und Kontrolle"}
];
function level(v){ if(v<=3) return {label:"Schon stark",kl:"lv-gut"}; if(v<=8) return {label:"Ausbaufähig",kl:"lv-mittel"}; return {label:"Großer Hebel",kl:"lv-hoch"}; }
function topArea(s){ let best=1; for(let m=2;m<=4;m++){ if(s[m]>s[best]) best=m; } return best; }

const SZENARIEN=[
  {label:"Größter Hebel: Fundament am Boden", s:{1:11,2:5,3:3,4:2}},
  {label:"Größter Hebel: Souveräne Führungsperson", s:{1:3,2:11,3:5,4:4}},
  {label:"Größter Hebel: Entspannt vom Hof", s:{1:2,2:4,3:11,4:5}},
  {label:"Größter Hebel: Souverän draußen", s:{1:2,2:3,3:5,4:11}},
  {label:"Gemischt: zwei Baustellen", s:{1:9,2:3,3:8,4:4}},
  {label:"Alles stark (kein Verkauf)", s:{1:2,2:1,3:3,4:2}}
];

function bereicheHTML(s){
  return MEILEN.map(m=>{
    const v=s[m.nr], lv=level(v), pct=Math.max(4,Math.round((12-v)/12*100));
    return `<div class="bereich">
      <div class="bereich-kopf"><span class="bereich-title">${m.nr} · ${m.title}</span><span class="bereich-level ${lv.kl}">${lv.label}</span></div>
      <div class="bereich-sub">${m.sub}</div>
      <div class="bar"><div class="bar-fill ${lv.kl}" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");
}
function ergebnisHTML(s){
  const max=Math.max(s[1],s[2],s[3],s[4]);
  const top=topArea(s);
  let intro,titel,text;
  if(max<=3){
    intro="Ihr seid schon richtig weit. In allen vier Bereichen steht bei euch das Fundament.";
    titel="Dein Fazit";
    text="Das ist richtig stark. Genieße eure Spaziergänge und bleib dran. Feile einfach dort weiter, wo noch ein bisschen Luft ist.";
  } else {
    intro="So sieht euer aktueller Stand in den vier Bereichen aus. Je kürzer und roter ein Balken, desto größer ist dort gerade dein <b>Hebel</b>.";
    titel="Dein größter Hebel";
    text=`Am meisten holst du gerade im Bereich <b>${MEILEN[top-1].title}</b> heraus. Genau da lohnt sich dein nächster Schritt am schnellsten.`;
  }
  return `<div class="kicker">Dein Gelände-Fahrplan</div>
    <h2 class="head">Deine vier Bereiche auf dem Weg ins Gelände</h2>
    <p class="lead">${intro}</p>
    ${bereicheHTML(s)}
    <div class="ergebnis-box"><h3>${titel}</h3><p>${text}</p></div>
    <div class="mailhint">📩 Deinen persönlichen Fahrplan schicke ich dir gleich in dein Postfach.</div>`;
}

const grid=document.getElementById("grid");
SZENARIEN.forEach(sz=>{
  grid.insertAdjacentHTML("beforeend",
    `<div><p class="demo-label">${sz.label}</p><div class="card">${ergebnisHTML(sz.s)}</div></div>`);
});
</script>
</body>
</html>
