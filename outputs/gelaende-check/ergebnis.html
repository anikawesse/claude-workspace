<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dein Gelände-Fahrplan | Anikas Pferdeakademie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rost:#7B3F28; --caramel:#A9603B; --beige:#E6C5B4; --beige-hell:#F3E7DE;
    --creme:#FAF4EF; --text:#3A2C24; --text-hell:#6E5B4F; --weiss:#FFFFFF; --gruen:#8FA98A; --blutrot:#C0392B;
    --schatten:0 10px 30px rgba(123,63,40,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:'Montserrat',system-ui,sans-serif;background:var(--creme);color:var(--text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:640px}
  .card{background:var(--weiss);border-radius:22px;box-shadow:var(--schatten);padding:38px 34px 30px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--rost),var(--caramel),var(--beige))}
  .kicker{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--caramel);margin-bottom:8px}
  h1{font-family:'Playfair Display',serif;font-size:27px;line-height:1.25;color:var(--rost);margin-bottom:16px}
  h2{font-family:'Playfair Display',serif;font-size:22px;line-height:1.3;color:var(--rost);margin-bottom:12px}
  p{color:var(--text-hell);margin-bottom:14px;font-size:15.5px}
  p.lead{color:var(--text);font-size:16px}
  b,strong{color:var(--rost);font-weight:600}
  .bereich{margin-bottom:18px}
  .bereich-kopf{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .bereich-title{font-weight:600;color:var(--text);font-size:15px}
  .bereich-sub{font-size:12.5px;color:var(--text-hell);margin:1px 0 7px}
  .bereich-level{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:99px;white-space:nowrap}
  .bar{height:12px;background:var(--beige-hell);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;transition:width .6s ease}
  .bar-fill.lv-gut{background:var(--gruen)} .bereich-level.lv-gut{background:rgba(143,169,138,.20);color:#5f7a5a}
  .bar-fill.lv-mittel{background:var(--caramel)} .bereich-level.lv-mittel{background:var(--beige-hell);color:var(--caramel)}
  .bar-fill.lv-hoch{background:var(--blutrot)} .bereich-level.lv-hoch{background:rgba(192,57,43,.14);color:var(--blutrot)}
  .ergebnis-box{background:var(--beige-hell);border-radius:16px;padding:22px 22px 18px;margin:22px 0 0}
  .ergebnis-box .bereich-head{font-size:14px;font-weight:700;color:var(--rost);margin:16px 0 4px}
  .doi-banner{background:rgba(143,169,138,.18);border:1px solid var(--gruen);color:#4d6a48;border-radius:12px;padding:12px 16px;font-size:14.5px;font-weight:600;margin-bottom:18px}
  @media(max-width:520px){.card{padding:30px 22px 24px}h1{font-size:24px}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="doi-banner" id="doiBanner" hidden>✅ Danke, deine Anmeldung ist bestätigt. Schön, dass du dabei bist. 💛</div>
      <div class="kicker">Dein Gelände-Fahrplan</div>
      <h1 id="head">Deine vier Bereiche auf dem Weg ins Gelände</h1>
      <p class="lead" id="ergIntro"></p>
      <div id="bereiche"></div>
      <div class="ergebnis-box" id="ergBox">
        <h2 id="ergTitel"></h2>
        <div id="ergText"></div>
      </div>
    </div>
  </div>

<script src="results.js"></script>
<script>
  const el = id => document.getElementById(id);
  function qp(n){ return new URLSearchParams(location.search).get(n); }
  function parseWerte(){
    const raw=(qp("werte")||"").split("-").map(x=>parseInt(x,10));
    if(raw.length!==4 || raw.some(v=>isNaN(v)||v<0||v>12)) return null;
    return {1:raw[0],2:raw[1],3:raw[2],4:raw[3]};
  }
  const s=parseWerte();
  if(!s){
    el("head").textContent="Hier ist dein Gelände-Fahrplan";
    el("ergIntro").innerHTML="Ich konnte dein Ergebnis leider nicht laden. Mach das Gelände-Quiz am besten einfach noch einmal.";
    el("ergBox").hidden=true;
  } else {
    const name=qp("name");
    if(name) el("head").textContent="Hallo "+name+", hier ist dein Fahrplan";
    const p=buildProfil(s);
    el("ergIntro").innerHTML=p.intro;
    el("bereiche").innerHTML=p.bereiche;
    el("ergTitel").textContent=p.titel;
    el("ergText").innerHTML=p.text;
  }

  // Double-Opt-in: kam der Klick aus der Bestaetigungs-Mail (?bestaetigen=<contactId>), Tag "doi" setzen.
  const bestaetigen=qp("bestaetigen");
  if(bestaetigen){
    el("doiBanner").hidden=false;
    try{
      fetch("/.netlify/functions/confirm",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id:bestaetigen})
      }).catch(()=>{});
    }catch(e){}
  }
</script>
</body>
</html>
