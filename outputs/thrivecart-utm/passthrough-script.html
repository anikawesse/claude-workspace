<!--
  LIVE Footer-Tracking-Script der Ads-Salespage (Devine Funnel → Tracking Code → Footer).
  Setzt die UTMs fest (paid) in plain UND passthrough-Format und hängt seit 03.08.2026
  zusätzlich die Meta-Klick-ID (fbclid) an alle ThriveCart-Checkout-Links.

  Warum fbclid: ThriveCart macht daraus fbc für die Conversions API.
  Zuvor kam die Klick-ID nie bei ThriveCart an → im Events Manager fbc = 0 %,
  Match Quality 5,7/10. Mit fbclid schließt sich die Attributions-Lücke.

  Die einzige Änderung ggü. der Vorversion: die beiden mit >>> markierten Zeilen.
-->
<script>
(function () {
  var fbclid = new URLSearchParams(window.location.search).get('fbclid'); // >>> neu
  function decorate() {
    document.querySelectorAll('a[href*="thrivecart.com"]').forEach(function (a) {
      try {
        var url = new URL(a.href, window.location.origin);
        url.searchParams.set('utm_source', 'facebook');
        url.searchParams.set('utm_medium', 'paid');
        url.searchParams.set('passthrough[utm_source]', 'facebook');
        url.searchParams.set('passthrough[utm_medium]', 'paid');
        if (fbclid) url.searchParams.set('fbclid', fbclid); // >>> neu
        a.href = url.toString();
      } catch (e) {}
    });
  }
  if (document.readyState !== 'loading') decorate();
  else document.addEventListener('DOMContentLoaded', decorate);
  setTimeout(decorate, 1500);
})();
</script>
